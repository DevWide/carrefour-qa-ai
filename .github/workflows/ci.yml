name: QA Automation com IA

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *' # suíte mobile completa toda noite (03:00 em Brasília)
  workflow_dispatch:
    inputs:
      gerar_casos_ia:
        description: 'Gerar novos casos de API com IA (para revisão humana)'
        type: boolean
        default: false
      browserstack:
        description: 'Executar suíte mobile em dispositivos reais (BrowserStack)'
        type: boolean
        default: false
      mobile_completo:
        description: 'Rodar a suíte mobile completa (desmarcado = só os cenários @smoke no Android)'
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Camada de IA (opcional): defina UMA das chaves como secret; sem chave ela roda em modo heurístico
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

# Como o pipeline decide o que rodar (para ficar leve e rápido):
# - Cada job só roda se a sua pasta mudou (job "mudancas"). Mudar só README/docs não roda nada pesado.
# - Push/PR que mexe no mobile: Android roda só os cenários @smoke (~5-7 min).
# - Suíte mobile completa (Android + iOS): toda noite, no botão "Run workflow" e em push na main que mexe no mobile.
# - Noite e "Run workflow" rodam tudo, independente do que mudou.
jobs:
  # ------------------------------------------------------------------ O que mudou neste commit/PR
  mudancas:
    name: Detectar pastas alteradas
    # Só faz sentido em push/PR; à noite e no "Run workflow" tudo roda e este job é pulado
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    outputs:
      api: ${{ steps.filtro.outputs.api }}
      ai: ${{ steps.filtro.outputs.ai }}
      mobile: ${{ steps.filtro.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            pipeline: &pipeline
              - '.github/workflows/**'
            ai:
              - *pipeline
              - 'ai/**'
            api:
              - *pipeline
              - 'api/**'
              - 'ai/**'
            mobile:
              - *pipeline
              - 'mobile/**'
              - 'ai/**'

  # ------------------------------------------------------------------ IA: testes unitários da própria camada
  ai-unit:
    name: IA · testes unitários
    needs: mudancas
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.mudancas.outputs.ai == 'true') }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: ai/package-lock.json }
      - run: npm ci
      - run: npm test

  # ------------------------------------------------------------------ API
  api:
    name: API · ServeRest
    needs: mudancas
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.mudancas.outputs.api == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: '**/package-lock.json' }
      - name: Instalar dependências
        run: |
          npm ci --prefix api
          npm ci --prefix ai

      - name: Subir ServeRest local (ambiente isolado e determinístico)
        working-directory: api
        run: |
          npx serverest --timeout 3600 > serverest.log 2>&1 &
          npx --yes wait-on http://localhost:3000/usuarios --timeout 60000

      - name: Suíte principal
        working-directory: api
        run: npm test

      - name: Divergências conhecidas (não bloqueia o pipeline)
        if: always()
        continue-on-error: true
        working-directory: api
        run: npm run test:known-issues

      - name: Relatório Allure
        if: always()
        working-directory: api
        run: npm run report:generate

      - name: 🤖 Triagem de falhas por IA
        if: always()
        working-directory: ai
        run: npm run analyze:api

      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-relatorios
          path: |
            api/allure-report
            api/allure-results
            api/ai-triage
            api/serverest.log
          retention-days: 30

  # ------------------------------------------------------------------ IA: geração de casos (manual)
  api-gerar-casos-ia:
    name: IA · gerar casos de API (revisão humana)
    if: github.event_name == 'workflow_dispatch' && inputs.gerar_casos_ia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: '**/package-lock.json' }
      - run: npm ci --prefix api && npm ci --prefix ai
      - name: Subir ServeRest
        working-directory: api
        run: |
          npx serverest --timeout 3600 > /dev/null 2>&1 &
          npx --yes wait-on http://localhost:3000/usuarios --timeout 60000
      - name: Gerar e validar casos (oráculo contra a API real)
        working-directory: api
        run: node ../ai/generate-api-cases.js --max 12
      - name: Casos propostos (baixar, revisar e commitar os aprovados)
        uses: actions/upload-artifact@v4
        with:
          name: casos-gerados-por-ia
          path: api/data/cadastro-invalido.ai.json
          if-no-files-found: ignore

  # ------------------------------------------------------------------ Mobile · Android (emulador)
  mobile-android:
    name: Mobile · Android (emulador)
    needs: mudancas
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.mudancas.outputs.mobile == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # O emulador do CI roda sem GPU: esperas em dobro e 1 nova tentativa por arquivo de spec (só no CI)
      WAIT_FACTOR: '2'
      SPEC_RETRIES: '1'
      # Suíte completa à noite, no "Run workflow" (se marcado) e em push na main; em PR, só @smoke
      MOCHA_GREP: ${{ !(github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mobile_completo) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '@smoke' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: '**/package-lock.json' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Habilitar KVM (aceleração do emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Instalar dependências, driver Appium e app
        run: |
          npm ci --prefix mobile
          npm ci --prefix ai
          cd mobile && npm run apps:download -- android

      - name: Suíte a executar
        run: 'echo "Cenários - ${MOCHA_GREP:-todos}"'

      # Cache do emulador já ligado (snapshot): nas próximas execuções ele volta do snapshot em vez de dar boot do zero.
      - name: Cache do emulador (AVD)
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-31-pixel7-x86_64-v1

      - name: Criar snapshot do emulador (só quando não há cache)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Snapshot do emulador criado para o cache."

      # Android 12 (API 31) é bem mais leve que o 14 no emulador por software; 4 núcleos e 4 GB de RAM.
      - name: Executar suíte no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          script: npm run test:android

      - name: Relatório Allure
        if: always()
        working-directory: mobile
        run: npm run report:generate

      - name: 🤖 Triagem de falhas por IA (com screenshots)
        if: always()
        working-directory: ai
        run: npm run analyze:mobile -- --suite "Mobile Android"

      - name: 🩺 Self-healing de seletores (sugestões, não aplica)
        if: failure()
        working-directory: ai
        run: npm run heal

      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-relatorios
          path: |
            mobile/allure-report
            mobile/evidence
            mobile/logs
            mobile/ai-triage
            mobile/ai-heal
          retention-days: 30

  # ------------------------------------------------------------------ Mobile · iOS (simulador)
  mobile-ios:
    name: Mobile · iOS (simulador)
    needs: mudancas
    # Suíte completa só à noite, no "Run workflow" ou em push na main que mexe no mobile (runner macOS é o mais lento)
    if: >-
      ${{ !cancelled() && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.mobile_completo) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.mudancas.outputs.mobile == 'true')
      ) }}
    runs-on: macos-latest
    timeout-minutes: 60
    # Validação do iOS ainda em andamento (ver "Resultados" no README): o job roda e publica evidências,
    # mas não bloqueia o pipeline enquanto os seletores específicos do iOS não forem confirmados.
    continue-on-error: true
    env:
      WAIT_FACTOR: '2'
      # Sem nova tentativa no iOS: a 1ª execução mostrou falha determinística (CT02); repetir só gastava ~5 min
      SPEC_RETRIES: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: '**/package-lock.json' }

      - name: Instalar dependências, driver Appium e app
        run: |
          npm ci --prefix mobile
          npm ci --prefix ai
          cd mobile && npm run apps:download -- ios

      # A maior parte do tempo do iOS não é teste (os 6 cenários de navegação e formulários levam ~1,5 min):
      # é o Appium compilando o WebDriverAgent no Xcode. Baixamos o WDA já compilado, da mesma versão do driver.
      # Se o download falhar, o Appium compila como antes (o job não quebra por isso).
      - name: Baixar WebDriverAgent pré-compilado
        continue-on-error: true
        working-directory: mobile
        run: |
          VERSAO=$(node -p "require('./node_modules/appium-xcuitest-driver/node_modules/appium-webdriveragent/package.json').version")
          ARCH=$([ "$(uname -m)" = "arm64" ] && echo arm64 || echo x86_64)
          curl -fsSL -o "$RUNNER_TEMP/wda.zip" "https://github.com/appium/WebDriverAgent/releases/download/v$VERSAO/WebDriverAgentRunner-Build-Sim-$ARCH.zip"
          unzip -q "$RUNNER_TEMP/wda.zip" -d "$RUNNER_TEMP/wda"
          WDA=$(find "$RUNNER_TEMP/wda" -maxdepth 6 -name 'WebDriverAgentRunner-Runner.app' | head -1)
          echo "WDA: $WDA"
          [ -n "$WDA" ] && echo "IOS_WDA_PATH=$WDA" >> "$GITHUB_ENV"

      # O 1º pipeline falhou porque o simulador não terminou de ligar em 2 min dentro do teste.
      # Ligamos o iPhone antes e passamos o UDID para o Appium.
      - name: Ligar o simulador antes dos testes
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const devs=Object.entries(JSON.parse(s).devices).filter(([r])=>r.includes("iOS"))
                .flatMap(([r,l])=>l.filter(d=>d.name.startsWith("iPhone")).map(d=>({...d,v:r})))
                .sort((a,b)=>b.v.localeCompare(a.v,undefined,{numeric:true}));
              console.log(devs[0].udid);
            })')
          echo "Simulador: $UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "IOS_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Executar suíte no simulador
        working-directory: mobile
        run: npm run test:ios

      - name: Relatório Allure
        if: always()
        working-directory: mobile
        run: npm run report:generate

      - name: 🤖 Triagem de falhas por IA (com screenshots)
        if: always()
        working-directory: ai
        run: npm run analyze:mobile -- --suite "Mobile iOS"

      - name: 🩺 Self-healing de seletores (sugestões, não aplica)
        if: failure()
        working-directory: ai
        run: npm run heal

      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-relatorios
          path: |
            mobile/allure-report
            mobile/evidence
            mobile/logs
            mobile/ai-triage
            mobile/ai-heal
          retention-days: 30

  # ------------------------------------------------------------------ Mobile · BrowserStack (dispositivos reais)
  mobile-browserstack:
    name: Mobile · BrowserStack (dispositivos reais)
    if: github.event_name == 'workflow_dispatch' && inputs.browserstack
    runs-on: ubuntu-latest
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: '**/package-lock.json' }
      - run: |
          npm ci --prefix mobile
          npm ci --prefix ai
          cd mobile && npm run apps:download -- android
      - working-directory: mobile
        run: npm run test:browserstack
      - if: always()
        working-directory: mobile
        run: npm run report:generate
      - if: always()
        working-directory: ai
        run: npm run analyze:mobile -- --suite "Mobile BrowserStack"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browserstack-relatorios
          path: |
            mobile/allure-report
            mobile/evidence
            mobile/ai-triage
          retention-days: 30
