# Pipeline equivalente no GitLab CI/CD (o PDF do desafio mobile pede GitLab).
# Diferenca em relacao ao GitHub Actions: os runners compartilhados do GitLab.com nao tem KVM nem macOS,
# entao a suite mobile roda no BrowserStack (dispositivos reais). Com runner proprio (macOS/KVM),
# os jobs mobile-android/ios do GitHub podem ser reproduzidos aqui sem mudancas no codigo.
#
# Variaveis (Settings > CI/CD > Variables): OPENAI_API_KEY, GEMINI_API_KEY ou ANTHROPIC_API_KEY (opcional),
# JEV_API_KEY (opcional, triagem hibrida TypeSafe AI), BROWSERSTACK_USERNAME e BROWSERSTACK_ACCESS_KEY (para o job mobile).

stages: [test, report]

default:
  image: node:22

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

# O GitLab aceita no maximo 2 arquivos em cache:key:files; uma chave fixa basta (o npm ci confere os lockfiles)
cache:
  key: npm-cache
  paths: [.npm/]

# Cada job so roda se a sua pasta mudou (em pipelines agendados, "changes" e sempre verdadeiro: roda tudo).
.mudou-ai: &mudou-ai [ai/**/*, .gitlab-ci.yml]
.mudou-api: &mudou-api [api/**/*, ai/**/*, .gitlab-ci.yml]
.mudou-mobile: &mudou-mobile [mobile/**/*, ai/**/*, .gitlab-ci.yml]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

ai-unit:
  stage: test
  rules:
    - changes: *mudou-ai
  script:
    - cd ai && npm ci && npm test

api:
  stage: test
  rules:
    - changes: *mudou-api
  script:
    - npm ci --prefix api && npm ci --prefix ai
    - cd api
    - (npx serverest --timeout 3600 > serverest.log 2>&1 &)
    - npx --yes wait-on http://localhost:3000/usuarios --timeout 60000
    - npm test
  after_script:
    - cd api && npx allure generate allure-results -o allure-report || true
    - cd ../ai && npm run analyze:api || true
  artifacts:
    when: always
    expire_in: 30 days
    paths: [api/allure-report, api/allure-results, api/ai-triage, api/serverest.log]

# Este job documenta 5 bugs REAIS da API ServeRest (KI-01 a KI-05).
# Ele vai falhar propositalmente. Tem allow_failure: true, entao o pipeline nao quebra.
# Se este job PASSAR, significa que a API foi corrigida! (atualizar o README secao 3)
api-known-issues:
  stage: test
  allow_failure: true
  rules:
    - changes: *mudou-api
  script:
    - echo "ATENCAO: Este job VAI FALHAR de proposito. Documenta bugs reais da ServeRest (KI-01 a KI-05)."
    - echo "Consulte o README secao 3 para detalhes."
    - npm ci --prefix api
    - cd api
    - (npx serverest --timeout 3600 > /dev/null 2>&1 &)
    - npx --yes wait-on http://localhost:3000/usuarios --timeout 60000
    - npm run test:known-issues || true
    - echo "Job de divergencias concluido. As falhas acima sao esperadas (allow_failure)."

mobile-browserstack:
  stage: test
  variables:
    # Mesmo ajuste do GitHub Actions: cada comando vai pela internet ate o aparelho real
    WAIT_FACTOR: "2"
    SPEC_RETRIES: "1"
  rules:
    - if: $BROWSERSTACK_USERNAME && $BROWSERSTACK_ACCESS_KEY
      changes: *mudou-mobile
  script:
    - npm ci --prefix mobile && npm ci --prefix ai
    - cd mobile && npm run apps:download -- android
    - npm run test:browserstack
  after_script:
    - cd mobile && npx allure generate allure-results -o allure-report || true
    - cd ../ai && npm run analyze:mobile -- --suite "Mobile BrowserStack" || true
    - npm run heal || true
  artifacts:
    when: always
    expire_in: 30 days
    paths: [mobile/allure-report, mobile/evidence, mobile/ai-triage, mobile/ai-heal]
