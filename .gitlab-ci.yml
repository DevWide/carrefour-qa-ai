# Pipeline equivalente no GitLab CI/CD (o PDF do desafio mobile pede GitLab).
# Diferença em relação ao GitHub Actions: os runners compartilhados do GitLab.com não têm KVM nem macOS,
# então a suíte mobile roda no BrowserStack (dispositivos reais). Com runner próprio (macOS/KVM),
# os jobs mobile-android/ios do GitHub podem ser reproduzidos aqui sem mudanças no código.
#
# Variáveis (Settings → CI/CD → Variables): OPENAI_API_KEY, GEMINI_API_KEY ou ANTHROPIC_API_KEY (opcional),
# JEV_API_KEY (opcional, triagem híbrida TypeSafe AI), BROWSERSTACK_USERNAME e BROWSERSTACK_ACCESS_KEY (para o job mobile).

stages: [test, report]

default:
  image: node:22

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

# O GitLab aceita no máximo 2 arquivos em cache:key:files; uma chave fixa basta (o npm ci confere os lockfiles)
cache:
  key: npm-cache
  paths: [.npm/]

# Cada job só roda se a sua pasta mudou (em pipelines agendados, "changes" é sempre verdadeiro: roda tudo).
.mudou-ai: &mudou-ai [ai/**/*, .gitlab-ci.yml]
.mudou-api: &mudou-api [api/**/*, ai/**/*, .gitlab-ci.yml]
.mudou-mobile: &mudou-mobile [mobile/**/*, ai/**/*, .gitlab-ci.yml]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

ai-unit:
  stage: test
  rules:
    - changes: *mudou-ai
  script:
    - cd ai && npm ci && npm test

api:
  stage: test
  rules:
    - changes: *mudou-api
  script:
    - npm ci --prefix api && npm ci --prefix ai
    - cd api
    - (npx serverest --timeout 3600 > serverest.log 2>&1 &)
    - npx --yes wait-on http://localhost:3000/usuarios --timeout 60000
    - npm test
  after_script:
    - cd api && npx allure generate allure-results -o allure-report || true
    - cd ../ai && npm run analyze:api || true
  artifacts:
    when: always
    expire_in: 30 days
    paths: [api/allure-report, api/allure-results, api/ai-triage, api/serverest.log]

api-known-issues:
  stage: test
  allow_failure: true # divergências requisito x implementação: visíveis, mas não bloqueiam
  rules:
    - changes: *mudou-api
  script:
    - echo "========================================"
    - echo "🐛 DIVERGÊNCIAS CONHECIDAS (KI-01 a KI-05)"
    - echo "========================================"
    - echo ""
    - echo "⚠️  ESTE JOB VAI FALHAR PROPOSITALMENTE!"
    - echo ""
    - echo "Estas falhas documentam bugs REAIS da API ServeRest"
    - echo "que violam o requisito ou boas práticas de segurança:"
    - echo ""
    - echo "  🔴 KI-01 (Crítica): Email case-sensitive (Fulano@x.com ≠ fulano@x.com)"
    - echo "  🔴 KI-02 (Crítica): GET /usuarios devolve senha em texto puro"
    - echo "  🟡 KI-03 (Normal):  Sem rate limit (requisito pede 100 req/min)"
    - echo "  🟢 KI-04 (Menor):   Recurso inexistente retorna 400 em vez de 404"
    - echo "  🟡 KI-05 (Normal):  Nome só com espaços é aceito (descoberto pela IA!)"
    - echo ""
    - echo "📋 Por que testes que falham intencionalmente?"
    - echo "   → Documentam o comportamento esperado vs. real"
    - echo "   → Acompanham se a API um dia for corrigida (teste passa = bug resolvido)"
    - echo "   → NÃO bloqueiam o pipeline (allow_failure: true)"
    - echo "   → NÃO gastam tokens de IA (marcados como @known-issue)"
    - echo ""
    - echo "Se este job PASSAR, significa que a API foi corrigida!"
    - echo "Nesse caso, atualize a documentação no README (seção 3)."
    - echo "========================================"
    - echo ""
    - npm ci --prefix api
    - cd api
    - (npx serverest --timeout 3600 > /dev/null 2>&1 &)
    - npx --yes wait-on http://localhost:3000/usuarios --timeout 60000
    - echo ""
    - echo "🧪 Executando testes de divergências conhecidas..."
    - npm run test:known-issues || true
    - echo ""
    - echo "========================================"
    - echo "✅ Job de divergências concluído (falhas são esperadas)"
    - echo "   Consulte os artefatos para detalhes de cada KI."
    - echo "========================================"

mobile-browserstack:
  stage: test
  variables:
    # Mesmo ajuste do GitHub Actions: cada comando vai pela internet até o aparelho real
    WAIT_FACTOR: "2"
    SPEC_RETRIES: "1"
  rules:
    - if: $BROWSERSTACK_USERNAME && $BROWSERSTACK_ACCESS_KEY
      changes: *mudou-mobile
  script:
    - npm ci --prefix mobile && npm ci --prefix ai
    - cd mobile && npm run apps:download -- android
    - npm run test:browserstack
  after_script:
    - cd mobile && npx allure generate allure-results -o allure-report || true
    - cd ../ai && npm run analyze:mobile -- --suite "Mobile BrowserStack" || true
    - npm run heal || true
  artifacts:
    when: always
    expire_in: 30 days
    paths: [mobile/allure-report, mobile/evidence, mobile/ai-triage, mobile/ai-heal]
